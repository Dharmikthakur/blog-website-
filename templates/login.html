{% extends "base.html" %}
{% block content %}
<div class="form-container" style="max-width: 500px;">
    <form method="POST" action="">
        <h2 style="font-size: 2.5rem; margin-bottom: 2rem; text-align: center;" class="text-gradient">Welcome Back</h2>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">
                <input type="checkbox" name="remember"> Remember me
            </label>
            <a href="#" style="font-size: 0.9rem; color: var(--accent-pink); text-decoration: none;">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; cursor: pointer; margin-bottom: 1.5rem;">Sign In</button>
        
        <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent-purple); text-decoration: none; font-weight: 600;">Register Now</a>
        </p>
    </form>
</div>
{% endblock content %}
