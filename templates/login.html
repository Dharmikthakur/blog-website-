{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="content-section bg-white p-5 rounded-4 shadow-sm">
                <form method="POST" action="">
                    <fieldset class="form-group">
                        <legend class="border-bottom mb-4 display-6 fw-bold text-center">Welcome Back</legend>
                        <p class="text-center text-muted mb-4">Login to your account to manage your posts and profile .</p>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-600">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control bg-light border-0" 
                                   placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-600">Password</label>
                            <input type="password" name="password" id="password" class="form-control bg-light border-0" 
                                   placeholder="Enter your password" required>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember">
                            <label class="form-check-label text-muted" for="remember">
                                Remember Me
                            </label>
                        </div>
                    </fieldset>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold">Login</button>
                    </div>
                </form>
                <div class="border-top pt-3 text-center">
                    <small class="text-muted">
                        Need an account? <a class="ms-2 fw-bold text-decoration-none" href="{{ url_for('register') }}">Sign Up Now</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
