{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="content-section bg-white p-5 rounded-4 shadow-sm">
                <form method="POST" action="">
                    <fieldset class="form-group">
                        <legend class="border-bottom mb-4 display-6 fw-bold text-center">Join Our Community</legend>
                        <p class="text-center text-muted mb-4">Create an account to start sharing your stories with the world.</p>
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-600">Username</label>
                            <input type="text" name="username" id="username" class="form-control bg-light border-0" 
                                   placeholder="Choose a unique username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-600">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control bg-light border-0" 
                                   placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-600">Password</label>
                            <input type="password" name="password" id="password" class="form-control bg-light border-0" 
                                   placeholder="Enter a strong password" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-600">Confirm Password</label>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control bg-light border-0" 
                                   placeholder="Repeat your password" required>
                        </div>
                    </fieldset>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold">Sign Up</button>
                    </div>
                </form>
                <div class="border-top pt-3 text-center">
                    <small class="text-muted">
                        Already have an account? <a class="ms-2 fw-bold text-decoration-none" href="{{ url_for('login') }}">Sign In</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
