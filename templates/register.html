{% extends "base.html" %}
{% block content %}
<div class="form-container" style="max-width: 500px;">
    <form method="POST" action="">
        <h2 style="font-size: 2.5rem; margin-bottom: 2rem; text-align: center;" class="text-gradient">Join Ozagi</h2>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="johndoe" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; cursor: pointer; margin-bottom: 1.5rem;">Create Account</button>
        
        <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-purple); text-decoration: none; font-weight: 600;">Sign In</a>
        </p>
    </form>
</div>
{% endblock content %}
