{% extends "base.html" %}
{% block content %}
<article>
    <div class="post-detail-header">
        <span class="tag">{{ post.date_posted.strftime('%B %d, %Y') }} • {{ post.author.username }}</span>
        <h1 style="font-size: 3.5rem; margin: 1.5rem 0; line-height: 1.1;">{{ post.title }}</h1>
        
        {% if post.author == current_user %}
            <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem;">
                <a href="{{ url_for('update_post', post_id=post.id) }}" class="btn-primary" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color);">Edit Post</a>
                <form action="{{ url_for('delete_post', post_id=post.id) }}" method="POST">
                    <button type="submit" class="btn-primary" style="background: rgba(255, 31, 142, 0.1); color: #ff1f8e; border: 1px solid #ff1f8e; cursor: pointer;">Delete</button>
                </form>
            </div>
        {% endif %}
    </div>

    <div style="max-width: 1200px; margin: 0 auto; padding: 0 5%;">
        <img src="{{ url_for('static', filename='post_pics/' + post.image_file) }}" alt="{{ post.title }}" class="post-detail-image">
    </div>

    <div class="post-detail-content">
        {{ post.content | safe }}
    </div>
</article>

<div style="padding: 4rem 5%; border-top: 1px solid var(--border-color); max-width: 800px; margin: 0 auto;">
    <h3 style="margin-bottom: 2rem;">Comments</h3>
    <div style="background: var(--card-bg); padding: 2rem; border-radius: 1.5rem; text-align: center; color: var(--text-muted);">
        Comments system coming soon.
    </div>
</div>
{% endblock content %}
