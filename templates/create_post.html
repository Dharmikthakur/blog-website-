{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <form method="POST" action="" enctype="multipart/form-data">
        <h2 style="font-size: 2.5rem; margin-bottom: 2rem;" class="text-gradient">{{ legend }}</h2>
        
        <div class="form-group">
            <label for="title">Post Title</label>
            <input type="text" name="title" id="title" class="form-control" value="{{ post.title if post else '' }}" placeholder="Enter a catchy title..." required>
        </div>

        <div class="form-group">
            <label for="image">Featured Image</label>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="file" name="image" id="image" class="form-control" accept="image/*" style="padding: 0.5rem;">
                {% if post and post.image_file %}
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Current Image: {{ post.image_file }}</p>
                {% endif %}
            </div>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea name="content" id="content" class="form-control" placeholder="Write your story here..." required>{{ post.content if post else '' }}</textarea>
        </div>

        <div style="display: flex; gap: 1.5rem; margin-top: 2rem;">
            <button type="submit" class="btn-primary" style="padding: 0.8rem 2rem; cursor: pointer;">{{ 'Publish Post' if legend == 'New Post' else 'Update Post' }}</button>
            <a href="{{ url_for('home') }}" class="nav-link" style="align-self: center;">Cancel</a>
        </div>
    </form>
</div>

<script>
    // Preview image before upload
    const imageInput = document.getElementById('image');
    imageInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            console.log('File selected:', file.name);
            // You could add a live preview here if desired
        }
    });
</script>
{% endblock content %}
